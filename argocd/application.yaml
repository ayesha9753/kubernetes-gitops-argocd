apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-gitops-argocd
  namespace: argocd
spec:
  project: default
  source:
    # Point this at your fork of the repo before applying.
    repoURL: https://github.com/ayesha9753/kubernetes-gitops-argocd.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
