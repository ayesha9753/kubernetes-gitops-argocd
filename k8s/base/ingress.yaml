apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-demo
  labels:
    app: gitops-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-demo
                port:
                  number: 80
